[project]
name = "lathe"
version = "0.32.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "httpx-ws",
    "pydantic",
    "python-dotenv",
    "python-socketio[asyncio_client]>=5.16.2",
    "aiohttp>=3.14.1",
    "cachetools>=7.0.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ripgrep>=15"]

[tool.pytest.ini_options]
testpaths = ["test_unit.py", "test_monitor.py", "test_demo_local.py", "test_sandbox.py"]
asyncio_mode = "auto"
addopts = "-q"
