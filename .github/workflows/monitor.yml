name: Isolated live monitor

on:
  workflow_dispatch:
    inputs:
      lab:
        description: Disposable lab to run (readiness is manual only)
        type: choice
        options: [monitor, readiness]
        default: monitor
      model:
        description: OpenRouter model for isolated qualification of the selected trusted ref
        type: string
        default: openrouter/pareto-code
      readiness_scope:
        description: Readiness scope (native uses fresh idle/busy saved chats only)
        type: choice
        options: [native, full]
        default: native
  schedule:
    - cron: '17 9 * * 1'
  push:
    branches: [main]
    paths:
      - 'lathe.py'
      - 'test_deployment.py'
      - 'testing_support.py'
      - 'monitor_e2e.py'
      - 'test_monitor.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/monitor.yml'

permissions:
  contents: read

# The OWUI toolkit ID is fixed. Serialize monitor runs; never cancel cleanup.
concurrency:
  group: lathe-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'rndmcnlly/lathe' && github.event_name != 'pull_request' && inputs.lab != 'readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LATHE_MONITOR_MODEL: ${{ inputs.model || 'openrouter/pareto-code' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Offline contracts
        run: uv run --locked pytest test_unit.py test_monitor.py
      - name: Disposable Open WebUI, real inference, real Daytona
        timeout-minutes: 35
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked python monitor_e2e.py
      - name: Verify host-writable evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          summary = Path("monitor-artifacts/summary.json")
          content = summary.read_bytes()
          summary.write_bytes(content)
          PY
      - name: Last-resort teardown
        if: always()
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked python monitor_e2e.py --cleanup
      - name: Sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor-artifacts/
          retention-days: 14
          if-no-files-found: warn

  readiness:
    if: github.repository == 'rndmcnlly/lathe' && github.event_name == 'workflow_dispatch' && inputs.lab == 'readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Offline readiness contracts
        run: uv run --locked pytest test_readiness.py test_monitor.py
      - name: Disposable multi-worker readiness lab
        timeout-minutes: 30
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked python readiness_lab.py --run --scope "${{ inputs.readiness_scope }}"
      - name: Exact-run teardown and verification
        if: always()
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: uv run --locked python readiness_lab.py --cleanup
      - name: Sanitized readiness evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor-artifacts/readiness-results/
          retention-days: 14
          if-no-files-found: warn
